services:



  ubuntu-basic:
    image: ubuntu:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile.devin.yml
    command: >
      /bin/bash -c "
      echo 1;
      while true; do
        echo "Running..."
        sleep 10  # Pauses for 1 second between iterations
      done
      "
    volumes:
      - .agents:/data/.agents